version: 2

build:
  os: ubuntu-22.04
  tools:
    # Sphinx 9 requires Python 3.12 or newer. The docs use the `:no-index:`
    # directive option, which needs Sphinx >= 7.2, so the old 7.1.2 pin can
    # no longer build this source tree.
    python: "3.12"

sphinx:
  configuration: source/conf.py

python:
  install:
     - requirements: source/requirements.txt

formats:
 - pdf
